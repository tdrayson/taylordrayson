          - paragraph [ref=f19e88]: Where Pro features include live push notifications, route planning, or navigation-related information, you assume all risk of using the Service while in or around a vehicle. You must not interact with the Service while the vehicle is in motion. Compliance with the Road Traffic Act 1988, the Highway Code, and all other applicable driving laws is your sole responsibility.
